<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Min side – Byttehjelpern</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:  #1a7a4a;
      --green2: #23a066;
      --lime:   #b6f060;
      --dark:   #0d1f14;
      --mid:    #1c3526;
      --text:   #e8f5ee;
      --muted:  #7aac8e;
      --card:   #152a1e;
      --radius: 16px;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; gap: 12px;
      background: rgba(13,31,20,0.95);
      border-bottom: 1px solid rgba(182,240,96,0.08);
      position: sticky; top: 0; z-index: 100; overflow: hidden;
    }
    .logo { font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: var(--lime); flex-shrink: 0; }
    .logo span { color: var(--text); }
    .nav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .nav-user {
      font-size: 0.8rem; color: var(--muted);
      max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    @media (max-width: 560px) { .nav-user { display: none; } }
    .btn-sm {
      padding: 8px 18px; border-radius: 100px;
      font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-outline-sm {
      background: transparent; color: var(--muted);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-outline-sm:hover { border-color: var(--lime); color: var(--lime); }
    .btn-lime {
      background: var(--lime); color: var(--dark);
      border: none; font-weight: 600;
    }
    .btn-lime:hover { background: #cdf577; }

    /* ── VIEWS ── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── AUTH BOX ── */
    .auth-wrap {
      min-height: calc(100vh - 65px);
      display: flex; align-items: center; justify-content: center;
      padding: 40px 24px;
    }
    .auth-box {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%; max-width: 420px;
    }
    .auth-box h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem; margin-bottom: 8px;
    }
    .auth-box p { color: var(--muted); font-size: 0.92rem; margin-bottom: 32px; line-height: 1.6; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.83rem; font-weight: 500; color: var(--muted); margin-bottom: 7px; }
    input[type="email"], input[type="password"], input[type="text"], input[type="number"], select {
      width: 100%; padding: 13px 16px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 12px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
      outline: none; transition: border-color 0.2s;
    }
    input::placeholder { color: rgba(122,172,142,0.5); }
    input:focus, select:focus { border-color: var(--lime); }
    select option { background: var(--dark); }
    .btn-block {
      width: 100%; padding: 14px;
      border-radius: 100px; border: none;
      background: var(--lime); color: var(--dark);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-block:hover { background: #cdf577; }
    .btn-block:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-switch {
      text-align: center; margin-top: 20px;
      font-size: 0.87rem; color: var(--muted);
    }
    .auth-switch a { color: var(--lime); cursor: pointer; text-decoration: none; }
    .auth-switch a:hover { text-decoration: underline; }
    .auth-msg {
      padding: 12px 16px; border-radius: 10px;
      font-size: 0.88rem; margin-bottom: 18px;
      display: none;
    }
    .auth-msg.error { background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.3); color: #ff9090; }
    .auth-msg.success { background: rgba(182,240,96,0.1); border: 1px solid rgba(182,240,96,0.3); color: var(--lime); }

    /* ── DASHBOARD ── */
    .dash-wrap {
      max-width: 860px; margin: 0 auto;
      padding: 48px 24px;
    }
    .dash-header { margin-bottom: 40px; }
    .dash-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.2rem; margin-bottom: 6px;
    }
    .dash-header p { color: var(--muted); font-size: 0.95rem; }

    /* Statusbanner */
    .status-banner {
      background: var(--card);
      border: 1px solid rgba(182,240,96,0.15);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 32px;
    }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .status-dot.active { background: var(--lime); box-shadow: 0 0 8px var(--lime); }
    .status-text { font-size: 0.9rem; color: var(--muted); }
    .status-text strong { color: var(--text); }

    /* Kort */
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
    @media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius);
      padding: 28px;
    }
    .card-icon { font-size: 1.6rem; margin-bottom: 12px; }
    .card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
    .card p { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
    .card-status {
      display: inline-block; margin-top: 14px;
      font-size: 0.78rem; font-weight: 600;
      padding: 4px 12px; border-radius: 100px;
      background: rgba(122,172,142,0.12); color: var(--muted);
    }
    .card-status.filled { background: rgba(182,240,96,0.12); color: var(--lime); }

    /* Skjema-seksjon */
    .form-section {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius);
      padding: 36px 32px;
      margin-bottom: 24px;
    }
    .form-section h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem; margin-bottom: 6px;
    }
    .form-section .section-desc {
      color: var(--muted); font-size: 0.9rem;
      margin-bottom: 28px; line-height: 1.6;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 560px) { .form-row { grid-template-columns: 1fr; } }

    /* Samtykke */
    .consent-box {
      background: rgba(182,240,96,0.05);
      border: 1.5px solid rgba(182,240,96,0.2);
      border-radius: 12px;
      padding: 20px;
      margin-top: 24px;
    }
    .consent-label {
      display: flex; gap: 12px; align-items: flex-start;
      cursor: pointer; font-size: 0.9rem; line-height: 1.6;
    }
    .consent-label input[type="checkbox"] {
      width: 18px; height: 18px; min-width: 18px;
      margin-top: 2px; accent-color: var(--lime);
      cursor: pointer;
    }

    .save-msg {
      display: none; margin-top: 16px;
      padding: 12px 16px; border-radius: 10px;
      background: rgba(182,240,96,0.1);
      border: 1px solid rgba(182,240,96,0.3);
      color: var(--lime); font-size: 0.9rem; font-weight: 500;
    }

    /* Profil */
    .profil-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .btn-rediger {
      background: transparent; border: 1px solid rgba(182,240,96,0.25);
      color: var(--lime); border-radius: 100px; padding: 6px 16px;
      font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-rediger:hover { background: rgba(182,240,96,0.1); }
    .profil-visning { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
    @media (max-width: 560px) { .profil-visning { grid-template-columns: 1fr; } }
    .profil-felt { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 12px 14px; }
    .profil-felt .felt-lbl { font-size: 0.75rem; color: var(--muted); margin-bottom: 3px; }
    .profil-felt .felt-val { font-size: 0.92rem; font-weight: 500; }
    .required-star { color: #ff9090; margin-left: 2px; }
    .felt-hint { font-size: 0.78rem; color: var(--muted); margin-top: 5px; }

    /* Multi-måler */
    .maaler-liste { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
    .maaler-kort {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 24px;
      position: relative;
    }
    .maaler-kort .maaler-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .maaler-kort .maaler-tittel {
      font-weight: 600; font-size: 1rem; color: var(--lime);
      display: flex; align-items: center; gap: 8px;
    }
    .maaler-kort .maaler-tittel span { color: var(--text); font-weight: 400; font-size: 0.85rem; }
    .btn-fjern {
      background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.2);
      color: #ff9090; border-radius: 8px; padding: 5px 12px;
      font-size: 0.8rem; cursor: pointer; font-family: 'DM Sans', sans-serif;
      transition: background 0.2s;
    }
    .btn-fjern:hover { background: rgba(255,80,80,0.2); }
    .btn-legg-til {
      display: flex; align-items: center; gap: 8px;
      background: rgba(182,240,96,0.08);
      border: 1.5px dashed rgba(182,240,96,0.3);
      border-radius: 12px; padding: 14px 20px;
      color: var(--lime); font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem; font-weight: 500;
      cursor: pointer; width: 100%;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-legg-til:hover { background: rgba(182,240,96,0.14); border-color: rgba(182,240,96,0.5); }

    /* Bekreftelse-epost */
    .confirm-note {
      text-align: center; padding: 16px;
      color: var(--muted); font-size: 0.88rem; line-height: 1.7;
    }
    .confirm-note strong { color: var(--lime); }

    /* ── LAYOUT MED SIDEBAR ── */
    .dash-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 0;
      min-height: calc(100vh - 60px);
    }
    @media (max-width: 768px) { .dash-layout { grid-template-columns: 1fr; } }

    /* ── SIDEBAR ── */
    .sidebar {
      background: #0e2018;
      border-right: 1px solid rgba(255,255,255,0.06);
      padding: 28px 16px;
      position: sticky; top: 60px;
      height: calc(100vh - 60px);
      overflow-y: auto;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: static; height: auto;
        display: flex; flex-wrap: wrap; gap: 8px;
        padding: 16px; border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
    }
    .sidebar-label {
      font-size: 0.7rem; font-weight: 600;
